<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display First Image in Table</title>
    </head>
    <body>
        <h1>First Image in Table</h1>

        <!-- Table to display the image -->
        <table id="image-table" border="1">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Image Name</th>
                </tr>
            </thead>
            <tbody>
                <!-- Image will be inserted here -->
            </tbody>
        </table>

        <script type="module">
            window.onload = async () => {
                try {
                    // Define the SQL query
                    const sqlQuery = `
                        SELECT
                            CONCAT('http://localhost/balansys/images/', folder.name, '/', image.name) AS image_name,
                            image.picture AS image_picture
                        FROM
                            image
                        LEFT JOIN folder ON image.folder = folder.folder;
                    `;

                    // Fetch data from the backend (example: POST request to your server-side script)
                    const response = await fetch('/getImages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({query: sqlQuery})
                    });

                    // Parse the response (assuming JSON data)
                    const data = await response.json();

                    // Display only the first image
                    if (data.length > 0) {
                        const firstImage = data[0]; // Get the first image object

                        // Create table row
                        const tableBody = document.querySelector('#image-table tbody');
                        const tr = document.createElement('tr');

                        // Populate the row with the image and its name
                        tr.innerHTML = `
                            <td><img src="${firstImage.image_name}" alt="First Image" style="width:150px;height:auto;"></td>
                            <td>${firstImage.image_name}</td>
                        `;

                        // Append the row to the table
                        tableBody.appendChild(tr);
                    } else {
                        console.error("No images found.");
                    }
                } catch (error) {
                    console.error("Error fetching data: ", error);
                }
            };
        </script>
    </body>
</html>
