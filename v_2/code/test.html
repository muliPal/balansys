<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create Table</title>
    </head>
    <body>

        <div id="table-container"></div>

        <script>
            //
            // Function to create a table
            function createTable() {
                //
                // Create a table element
                const table = document.createElement('table');
                table.setAttribute('border', '1'); // Optional: Add border to the table
                //
                // Create a table header row
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                //
                // Create 3 table headers (th)
                const headers = ['Header 1', 'Header 2', 'Header 3'];
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.textContent = headerText;
                    headerRow.appendChild(th);
                });

                thead.appendChild(headerRow);
                table.appendChild(thead);
                //
                // Add table body with dummy data
                const tbody = document.createElement('tbody');
                for (let i = 0; i < 3; i++) {
                    const row = document.createElement('tr');
                    //
                    // Create 3 columns per row
                    for (let j = 0; j < 3; j++) {
                        const td = document.createElement('td');
                        td.textContent = `Row ${i + 1} Col ${j + 1}`;
                        row.appendChild(td);
                    }

                    tbody.appendChild(row);
                }

                table.appendChild(tbody);
                //
                // Append the table to the container div
                document.getElementById('table-container').appendChild(table);
            }
            //
            // Call the function to create and display the table
            createTable();
        </script>

    </body>
</html>
