<!DOCTYPE html>
<html>
    <head>
        <title>Transcribe</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="transcribe.css">
        <script type="module">
            //
            //import the transcribe class to make it visible on our html
            import{mock_up} from "./transcribe.js";
            //
            //After the page loads execute the transcibe class
            window.onload = async () => {
                //
                //create an object of the transcribe class
                const my_transcribe = new mock_up();
                //
                //showing the transcription tables
                await my_transcribe.show();
            };
        </script>
    </head>
    <body>
        <div id="file"></div>
        <div id="navigate">
            <button id="prevBtn">Prev</button>
            <button id="nextBtn">Next</button>
        </div>
        <div id="image"></div>
        <div id="receipt"></div>
        <div id="purchase"></div>
    </body>
</html>
